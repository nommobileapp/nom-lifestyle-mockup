<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10110f"><title>NOM Lifestyle — Interactive Mockup</title>
<style>
:root{--bg:#10110f;--panel:#191a17;--muted:#a4a59c;--text:#f7f6f0;--orange:#ff6a2a;--line:#30312b;--green:#b8e986}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#171814 0,#10110f 46%)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;position:sticky;top:0;background:#10110fee;backdrop-filter:blur(16px);z-index:5;border-bottom:1px solid #ffffff08}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);font-weight:900;font-size:18px;position:relative}.mark:after{content:"";position:absolute;width:7px;height:7px;background:var(--orange);border-radius:50%;right:-2px;top:2px}.brand strong{letter-spacing:4px;font-size:18px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2.3px;margin-top:2px}.iconbtn{border:1px solid var(--line);background:#1b1c18;color:white;border-radius:50%;width:40px;height:40px;font-size:18px}.hero{padding:27px 20px 18px}.eyebrow{color:var(--orange);font-size:10px;letter-spacing:2.6px;font-weight:800}.hero h1{font-size:clamp(34px,9vw,48px);line-height:.99;letter-spacing:-2px;margin:12px 0 13px;font-weight:750}.hero h1 span{color:var(--orange)}.hero p{color:#b9b9af;line-height:1.55;font-size:13px;max-width:330px;margin:0 0 20px}.search{display:flex;gap:8px;padding:6px;background:#20211d;border:1px solid #373830;border-radius:15px}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white;padding:10px;font-size:13px}.search button{border:0;border-radius:10px;background:var(--orange);color:#17100c;padding:0 16px;font-weight:800}.section{padding:13px 20px 7px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section h2{font-size:18px;margin:0;letter-spacing:-.4px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.textbtn{background:none;border:0;color:var(--orange);font-size:12px;font-weight:700}.categories{display:flex;gap:8px;overflow:auto;padding:0 20px 15px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #3a3b34;border-radius:100px;background:#1b1c18;color:#c9c9c0;padding:10px 13px;font-size:12px}.chip.active{background:var(--orange);border-color:var(--orange);color:#1b100b;font-weight:800}.feature{margin:0 20px 18px;border-radius:20px;overflow:hidden;position:relative;height:205px;background:#292b23}.feature img{width:100%;height:100%;object-fit:cover;opacity:.78}.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090a08e8,transparent 75%)}.featurecopy{position:absolute;z-index:1;bottom:16px;left:17px;right:17px}.tag{font-size:9px;letter-spacing:1.5px;color:var(--green);font-weight:800}.feature h3{font-size:25px;margin:6px 0}.feature p{font-size:11px;color:#ddd;margin:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px}.card{background:var(--panel);border:1px solid #2b2c26;border-radius:16px;overflow:hidden;min-width:0}.cardimg{height:125px;position:relative;background:#292b23}.cardimg img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;border:0;background:#10110fc9;color:white;border-radius:50%;width:31px;height:31px;font-size:17px}.heart.saved{color:var(--orange)}.cardbody{padding:11px}.cardbody h3{font-size:13px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);line-height:1.5}.rating{color:var(--green);font-size:11px;margin-top:7px}.pill{display:inline-block;color:var(--orange);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;justify-content:space-around;background:#151612f5;backdrop-filter:blur(20px);border-top:1px solid #33342c;padding:11px 8px calc(11px + env(safe-area-inset-bottom));z-index:6}.navitem{background:none;border:0;color:#85867d;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:52px}.navitem b{font-size:19px;font-weight:500}.navitem.active{color:var(--orange)}.toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#f4f0e7;color:#151510;padding:12px 16px;border-radius:12px;font-size:12px;box-shadow:0 8px 30px #0008;display:none;width:max-content;max-width:90%}.panel{margin:0 20px 20px;padding:17px;border:1px solid var(--line);background:#1a1b17;border-radius:17px}.panel h3{margin:0 0 8px}.panel p{font-size:12px;color:var(--muted);line-height:1.5}.panel input,.panel select{width:100%;background:#10110f;color:white;border:1px solid #3b3c34;border-radius:10px;padding:12px;margin:5px 0 12px}.primary{background:var(--orange);color:#1b100b;border:0;border-radius:11px;padding:12px 15px;font-weight:800;width:100%}.empty{padding:35px 20px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.feedpost{margin:0 20px 13px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.feedpost img{width:100%;height:180px;object-fit:cover}.feedcaption{padding:13px;font-size:12px;color:#ddd}.feedcaption strong{color:white}.feedactions{display:flex;gap:15px;margin-top:10px}.feedactions button{background:none;border:0;color:#c9c9c0;padding:0;font-size:12px}
</style></head><body><div class="app"><header><div class="brand"><div class="mark">N</div><div><strong>NOM</strong><small>JOURNEY BEYOND</small></div></div><button class="iconbtn" id="profileBtn" aria-label="Profile">◉</button></header><main id="main"></main><nav class="bottomnav"><button class="navitem active" data-page="home"><b>⌂</b>Home</button><button class="navitem" data-page="explore"><b>⌕</b>Explore</button><button class="navitem" data-page="social"><b>◎</b>Community</button><button class="navitem" data-page="saved"><b>♡</b>Saved</button><button class="navitem" data-page="trip"><b>✧</b>My trip</button></nav></div><div class="toast" id="toast"></div>
<script>
const places=[
{id:1,name:'Kelingking Beach',city:'Nusa Penida, Bali',category:'nature',rating:'4.9',price:'Free to visit',img:'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=800&q=85',desc:'Dramatic cliffs and turquoise water.'},
{id:2,name:'Tropical Brunch Club',city:'Canggu, Bali',category:'cafe',rating:'4.8',price:'IDR 80k–150k',img:'https://images.unsplash.com/photo-1551218808-94e220e084d2?auto=format&fit=crop&w=800&q=85',desc:'Slow mornings, good coffee, bright plates.'},
{id:3,name:'Ubud Green Escape',city:'Ubud, Bali',category:'nature',rating:'4.7',price:'From IDR 50k',img:'https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=800&q=85',desc:'A quiet green escape in the highlands.'},
{id:4,name:'Sundown Social',city:'Seminyak, Bali',category:'bar',rating:'4.6',price:'IDR 100k–250k',img:'https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=800&q=85',desc:'Cocktails and golden-hour energy.'},
{id:5,name:'Warung Sari',city:'Ubud, Bali',category:'food',rating:'4.8',price:'IDR 25k–70k',img:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=85',desc:'Local flavours with fresh ingredients.'},
{id:6,name:'Coastal Hideaway',city:'Uluwatu, Bali',category:'stay',rating:'4.9',price:'From IDR 900k/night',img:'https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=85',desc:'A slow stay with ocean views.'}
];let page='home',category='all',query='',saved=new Set(),likes=new Set(),trip=[];
const main=document.getElementById('main');function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function card(p){return `<article class="card"><div class="cardimg"><img src="${p.img}" alt="${p.name}" loading="lazy"><button class="heart ${saved.has(p.id)?'saved':''}" onclick="toggleSave(${p.id})">${saved.has(p.id)?'♥':'♡'}</button></div><div class="cardbody"><div class="pill">${p.category}</div><h3>${p.name}</h3><div class="meta">⌖ ${p.city}<br>${p.price}</div><div class="rating">★ ${p.rating} <span style="color:#8c8d83"> · Mock rating</span></div><button class="textbtn" style="padding:10px 0 0" onclick="details(${p.id})">Explore place ↗</button></div></article>`}function filtered(){return places.filter(p=>(category==='all'||p.category===category)&&(`${p.name} ${p.city} ${p.category}`.toLowerCase().includes(query.toLowerCase())))}function head(title,sub){return `<div class="sectionhead"><div><h2>${title}</h2><div class="sub">${sub}</div></div></div>`}function categorybar(){return `<div class="categories">${[['all','✦ For you'],['food','🍜 Food'],['cafe','☕ Cafes'],['bar','🍸 Bars'],['nature','🌿 Nature'],['stay','🛏 Stays']].map(([v,l])=>`<button class="chip ${category===v?'active':''}" onclick="setCategory('${v}')">${l}</button>`).join('')}</div>`}function home(){return `<section class="hero"><div class="eyebrow">YOUR WORLD, UNLOCKED</div><h1>Journey<br><span>Beyond.</span></h1><p>Find your next favourite place. Discover local gems, share your moments, and make every journey count.</p><div class="search"><input id="searchInput" placeholder="Search places, food, cities…" value="${query.replace(/"/g,'&quot;')}"><button onclick="runSearch()">Explore ↗</button></div></section><div class="feature"><img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1200&q=85" alt="Bali tropical coast"><div class="featurecopy"><div class="tag">✦ NOM SPOTLIGHT · INDONESIA</div><h3>Bali, beyond the usual.</h3><p>Hidden corners. Local flavour. Your kind of journey.</p></div></div><section class="section">${head('Discover your vibe','A little inspiration for the next adventure')}</section>${categorybar()}<section class="section">${head(query?'Search results':'Trending around Bali',`${filtered().length} places to explore`)}</section><div class="cards">${filtered().map(card).join('')||'<div class="empty">No matches yet. Try another search.</div>'}</div>`}function explore(){return `<section class="hero"><div class="eyebrow">EXPLORE MORE</div><h1>Find your<br><span>somewhere.</span></h1><p>Search the places, tastes, and experiences that make a destination yours.</p><div class="search"><input id="searchInput" placeholder="Try “cafe in Ubud”" value="${query.replace(/"/g,'&quot;')}"><button onclick="runSearch()">Search</button></div></section>${categorybar()}<section class="section">${head('Places for you','Demo listings — live data not connected yet')}</section><div class="cards">${filtered().map(card).join('')||'<div class="empty">No places found.</div>'}</div><div class="panel"><h3>Map preview</h3><p>Interactive map integration is planned. This mockup uses place cards so you can test discovery without a map API key.</p><button class="primary" onclick="toast('Map integration is planned for the next build.')">Preview map feature</button></div>`}function social(){return `<section class="hero"><div class="eyebrow">NOM COMMUNITY</div><h1>Stories from<br><span>out there.</span></h1><p>Share the places you love and get inspired by the NOM community.</p><button class="primary" onclick="toast('Photo upload will connect to the backend in a later build.')">＋ Create a post</button></section><section class="section">${head('Community highlights','Sample posts for the mockup')}</section><article class="feedpost"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1000&q=85" alt="Ocean view"><div class="feedcaption"><strong>@nomad.days</strong> Found a quiet corner of the coast. This is your reminder to take the scenic route.<div class="feedactions"><button onclick="like(1)">${likes.has(1)?'♥':'♡'} ${likes.has(1)?'Liked':'Like'}</button><button onclick="toast('Comments are a planned feature.')">◯ Comment</button><button onclick="toast('Share link will be available when published.')">↗ Share</button></div></div></article><article class="feedpost"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=85" alt="Coffee"><div class="feedcaption"><strong>@coffee.and.miles</strong> Good coffee, no plans, and a whole new city to wander.<div class="feedactions"><button onclick="like(2)">${likes.has(2)?'♥':'♡'} ${likes.has(2)?'Liked':'Like'}</button><button onclick="toast('Comments are a planned feature.')">◯ Comment</button><button onclick="toast('Share link will be available when published.')">↗ Share</button></div></div></article>`}function savedPage(){let ps=places.filter(p=>saved.has(p.id));return `<section class="hero"><div class="eyebrow">YOUR COLLECTION</div><h1>Places to<br><span>come back to.</span></h1><p>Save places here as you explore.</p></section><section class="section">${head('Your saved places',`${ps.length} saved`)}</section><div class="cards">${ps.map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nothing saved yet.<br>Tap the ♡ on any place card to keep it here.</div>'}</div>`}function tripPage(){return `<section class="hero"><div class="eyebrow">TRAVEL PLANNER</div><h1>Make room<br>for <span>wonder.</span></h1><p>Start a simple trip plan and collect the places you want to visit.</p></section><div class="panel"><h3>Plan a journey</h3><label class="meta">Destination</label><input id="dest" placeholder="e.g. Bali, Indonesia" value="Bali, Indonesia"><label class="meta">Total budget (IDR)</label><input id="budget" type="number" placeholder="e.g. 3000000" value="3000000"><label class="meta">Trip length</label><select id="days"><option>2 days</option><option selected>3 days</option><option>5 days</option><option>7 days</option></select><button class="primary" onclick="makeTrip()">Create my trip ✦</button></div><section class="section">${head('Your trip shortlist',`${trip.length} places added`)}</section><div class="cards">${trip.map(id=>places.find(p=>p.id===id)).filter(Boolean).map(card).join('')||'<div class="empty" style="grid-column:1/-1">Your trip shortlist will appear here.</div>'}</div><div class="section"><button class="textbtn" onclick="addTripOptions()">＋ Add suggested places</button></div>`}function profile(){return `<section class="hero"><div class="eyebrow">YOUR NOM PROFILE</div><h1>Your life.<br><span>Your journey.</span></h1><p>This is a preview of your account area. Real sign-in is not connected in this mockup.</p></section><div class="panel"><h3>Welcome to NOM</h3><p>When authentication is connected, your profile, posts, and saved places will sync to your account.</p><label class="meta">Email address (demo only)</label><input placeholder="you@example.com" type="email"><button class="primary" onclick="toast('Authentication is not connected in this mockup.')">Continue</button></div><div class="panel"><h3>Prototype status</h3><p>Clickable UI: working · Search and filters: working · Saved places: working in this session · Live database, login, uploads, and booking: not connected.</p></div>`}function render(){document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===page));main.innerHTML=page==='home'?home():page==='explore'?explore():page==='social'?social():page==='saved'?savedPage():page==='trip'?tripPage():profile();let si=document.getElementById('searchInput');if(si)si.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()})}function setCategory(c){category=c;render()}function runSearch(){query=(document.getElementById('searchInput')?.value||'').trim();page='explore';render()}function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);toast(saved.has(id)?'Saved to your collection ♥':'Removed from saved places');render()}function details(id){let p=places.find(x=>x.id===id);toast(`${p.name} · ${p.city} — demo place details`)}function like(id){likes.has(id)?likes.delete(id):likes.add(id);render()}function makeTrip(){let d=document.getElementById('dest').value||'your destination',b=Number(document.getElementById('budget').value||0),days=document.getElementById('days').value;trip=[1,2,5];toast(`Trip draft for ${d}: ${days}, budget IDR ${b.toLocaleString('en-US')}. Demo only.`);render()}function addTripOptions(){trip=[...new Set([...trip,1,2,3,5])];toast('Suggested places added to your shortlist');render()}document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;query='';category='all';render();window.scrollTo({top:0,behavior:'smooth'})}));document.getElementById('profileBtn').addEventListener('click',()=>{page='profile';render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
