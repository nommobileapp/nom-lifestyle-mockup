<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>NOM — File Picker Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px 20px 50px;background:#101010;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
main{max-width:620px;margin:auto}
h1{font-size:27px}
p{color:#aaa;line-height:1.5}
.test{background:#1b1b1b;border:1px solid #383838;border-radius:16px;padding:18px;margin:18px 0}
label{display:block;color:#c8f45a;font-size:13px;font-weight:bold;margin:0 0 12px}
input[type=file]{display:block;width:100%;min-height:54px;padding:12px;background:#111;color:#fff;border:1px solid #555;border-radius:10px;font-size:14px}
#result{color:#c8f45a;white-space:pre-wrap;font-size:13px}
a{color:#ff7a24}
</style>
</head>
<body>
<main>
<div style="color:#ff7a24;font-weight:bold;letter-spacing:3px">NOM · DIAGNOSTIC</div>
<h1>File picker test</h1>
<p>This is a standalone test page. It does not connect to your account, Supabase or the NOM upload system. Nothing is uploaded or saved.</p>
<section class="test">
<label for="photoTest">TEST 1 — Choose a photo or video</label>
<input id="photoTest" type="file" accept="image/*,video/*" multiple>
</section>
<section class="test">
<label for="generalTest">TEST 2 — Choose any file</label>
<input id="generalTest" type="file" multiple>
</section>
<p id="result">No file selected yet.</p>
<p><a href="./">Return to NOM</a></p>
</main>
<script>
for(const id of ["photoTest","generalTest"]){
 document.getElementById(id).addEventListener("change",function(){
  const names=Array.from(this.files||[]).map(f=>f.name);
  document.getElementById("result").textContent=names.length?("Selected "+names.length+" file(s):\n"+names.join("\n")):"No file selected.";
 });
}
</script>
</body>
</html>
